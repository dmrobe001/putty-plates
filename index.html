<title>Putty Plates</title>

<style>
/* Layout: one full-bleed WebGL globe; a translucent instrument panel floats at left (bottom sheet on phones); legend floats bottom-right.
   Deliberately single dark look: a planet against space. */
:root {
  color-scheme: dark;
  --space: #0a0f15;
  --space-2: #131b26;
  --panel: rgba(16, 23, 32, 0.86);
  --line: rgba(160, 178, 198, 0.18);
  --ink: #dbe2ea;
  --muted: #8a99aa;
  --ochre: #d9a441;      /* accent: the ochre of a geologic-map legend */
  --ochre-ink: #1a1307;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.78rem;
  --step-0: 0.9rem;
  --step-1: 1.15rem;
  --step-2: 1.5rem;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 60% 40%, var(--space-2), var(--space) 70%);
  color: var(--ink); font-family: var(--font-ui); font-size: var(--step-0);
}
#globe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#globe:active { cursor: grabbing; }

#panel {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: calc(12px + env(safe-area-inset-left, 0px));
  width: 292px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-direction: column; gap: 14px;
  padding: 14px 16px 16px;
  box-sizing: border-box;
}
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: var(--step-2); font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
#toggle { display: none; }
.clock { font-family: var(--font-data); font-size: var(--step-1); color: var(--ochre); font-variant-numeric: tabular-nums; }
.clock small { color: var(--muted); font-size: var(--step--1); }

.row { display: flex; gap: 8px; }
button {
  font: inherit; font-weight: 500; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 10px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
button.primary { background: var(--ochre); color: var(--ochre-ink); border-color: var(--ochre); min-width: 76px; }
.grow { flex: 1; }

.group { display: flex; flex-direction: column; gap: 10px; }
.label {
  font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline;
}
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctl .name { font-weight: 500; }
.ctl .val { font-family: var(--font-data); font-size: var(--step--1); font-variant-numeric: tabular-nums; color: var(--ink); }
.ctl .hint { font-size: var(--step--1); color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--ochre); margin: 2px 0; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.seg button { padding: 5px 6px; font-size: var(--step--1); }
.seg button[aria-pressed="true"] { border-color: var(--ochre); color: var(--ochre); }

.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: var(--step--1); }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-data); text-align: right; font-variant-numeric: tabular-nums; }

#log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: var(--step--1); min-height: 3.6em; }
#log li { display: grid; grid-template-columns: 4.6em 1fr; gap: 6px; }
#log .t { font-family: var(--font-data); color: var(--ochre); text-align: right; font-variant-numeric: tabular-nums; }
#log .empty { color: var(--muted); display: block; }

#legend {
  position: fixed;
  right: calc(12px + env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; font-size: var(--step--1); width: 220px; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 4px;
}
#legend canvas { width: 100%; height: 10px; display: block; border-radius: 2px; }
#legend .ticks { display: flex; justify-content: space-between; font-family: var(--font-data); color: var(--muted); }
#legend .keys { display: flex; flex-wrap: wrap; gap: 4px 12px; }
#legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.helptext { font-size: var(--step--1); color: var(--muted); line-height: 1.35; }
kbd { font-family: var(--font-data); font-size: 0.72rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }

@media (max-width: 640px) {
  #panel {
    top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: auto; max-height: 48%;
  }
  #panel.collapsed > :not(.head) { display: none; }
  #toggle { display: inline-block; padding: 3px 8px; font-size: var(--step--1); }
  #legend { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; right: max(8px, env(safe-area-inset-right, 0px)); width: 180px; }
  .keyhelp { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

<script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
<script>
"use strict";
/* =====================================================================
   Putty Plates, slice 0: kinematic skeleton.
   Mesh: jittered Fibonacci points, spherical Delaunay (stereographic + Delaunator).
   State lives on the fixed (Eulerian) mesh; plates move rigidly and are
   re-sampled onto it with a per-plate lagged semi-Lagrangian step.
   The rules below are placeholders until the algorithm document lands.
   ===================================================================== */

const R_KM = 6371;            // planet radius (km); 1 cm/yr = 10 km/Myr
const MAXP = 64;              // plate slot capacity

// ---------- small utilities ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(rng) { let u = 0, v = 0; while (u === 0) u = rng(); v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function randUnit(rng) { const z = 2 * rng() - 1, p = 2 * Math.PI * rng(), r = Math.sqrt(1 - z * z); return [r * Math.cos(p), r * Math.sin(p), z]; }

// Rotation matrix (row-major 3x3) about unit axis by angle.
function rotMat(ax, ay, az, a) {
  const c = Math.cos(a), s = Math.sin(a), t = 1 - c;
  return [t*ax*ax + c, t*ax*ay - s*az, t*ax*az + s*ay,
          t*ax*ay + s*az, t*ay*ay + c, t*ay*az - s*ax,
          t*ax*az - s*ay, t*ay*az + s*ax, t*az*az + c];
}
function mul3(A, B) {
  const C = new Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
    C[3*r + c] = A[3*r] * B[c] + A[3*r + 1] * B[3 + c] + A[3*r + 2] * B[6 + c];
  return C;
}
const I3 = () => [1, 0, 0, 0, 1, 0, 0, 0, 1];
const rotAngle = M => Math.acos(Math.max(-1, Math.min(1, (M[0] + M[4] + M[8] - 1) / 2)));

class Heap { // min-heap of (key, value)
  constructor(cap) { this.k = new Float64Array(cap); this.v = new Int32Array(cap); this.n = 0; }
  push(key, val) {
    if (this.n === this.k.length) { const k = new Float64Array(this.n * 2), v = new Int32Array(this.n * 2); k.set(this.k); v.set(this.v); this.k = k; this.v = v; }
    let i = this.n++; const K = this.k, V = this.v;
    while (i > 0) { const p = (i - 1) >> 1; if (K[p] <= key) break; K[i] = K[p]; V[i] = V[p]; i = p; }
    K[i] = key; V[i] = val;
  }
  pop() { // returns value; key in this.lastKey
    const K = this.k, V = this.v, top = V[0]; this.lastKey = K[0];
    const key = K[--this.n], val = V[this.n]; let i = 0;
    for (;;) { let c = 2*i + 1; if (c >= this.n) break; if (c + 1 < this.n && K[c + 1] < K[c]) c++; if (K[c] >= key) break; K[i] = K[c]; V[i] = V[c]; i = c; }
    K[i] = key; V[i] = val; return top;
  }
}

// ---------- mesh ----------
function buildMesh(N, rng) {
  const P = new Float64Array(3 * N), h = Math.sqrt(4 * Math.PI / N), ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const z = 1 - (2 * i + 1) / N, r = Math.sqrt(1 - z * z), ph = i * ga;
    let x = r * Math.cos(ph) + 0.3 * h * (rng() - 0.5), y = r * Math.sin(ph) + 0.3 * h * (rng() - 0.5), w = z + 0.3 * h * (rng() - 0.5);
    if (i === 0) { x = 0; y = 0; w = 1; }                // projection pole
    const l = Math.hypot(x, y, w); P[3*i] = x / l; P[3*i + 1] = y / l; P[3*i + 2] = w / l;
  }
  // Stereographic projection from point 0 (the north pole); the planar Delaunay is the spherical one.
  const xy = new Float64Array(2 * (N - 1));
  for (let i = 1; i < N; i++) { const d = 1 - P[3*i + 2]; xy[2*(i - 1)] = P[3*i] / d; xy[2*(i - 1) + 1] = P[3*i + 1] / d; }
  const D = new Delaunator(xy);
  const nt = D.triangles.length / 3, H = D.hull.length, T = new Uint32Array(3 * (nt + H));
  for (let t = 0; t < nt; t++) for (let k = 0; k < 3; k++) T[3*t + k] = D.triangles[3*t + k] + 1;
  for (let k = 0; k < H; k++) { T[3*(nt + k)] = 0; T[3*(nt + k) + 1] = D.hull[k] + 1; T[3*(nt + k) + 2] = D.hull[(k + 1) % H] + 1; }
  // Orient all triangles counter-clockwise seen from outside.
  const ntot = nt + H;
  for (let t = 0; t < ntot; t++) {
    const a = T[3*t], b = T[3*t + 1], c = T[3*t + 2];
    const ux = P[3*b] - P[3*a], uy = P[3*b + 1] - P[3*a + 1], uz = P[3*b + 2] - P[3*a + 2];
    const vx = P[3*c] - P[3*a], vy = P[3*c + 1] - P[3*a + 1], vz = P[3*c + 2] - P[3*a + 2];
    const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    if (nx * P[3*a] + ny * P[3*a + 1] + nz * P[3*a + 2] < 0) { T[3*t + 1] = c; T[3*t + 2] = b; }
  }
  // CSR adjacency: in a closed oriented triangulation each directed edge a->b occurs exactly once.
  const deg = new Int32Array(N + 1);
  for (let t = 0; t < ntot; t++) for (let k = 0; k < 3; k++) deg[T[3*t + k] + 1]++;
  for (let i = 0; i < N; i++) deg[i + 1] += deg[i];
  const nbr = new Int32Array(deg[N]), fill = deg.slice(0, N);
  for (let t = 0; t < ntot; t++) for (let k = 0; k < 3; k++) nbr[fill[T[3*t + k]]++] = T[3*t + (k + 1) % 3];
  return { N, P, T, off: deg, nbr, h };
}

// ---------- world state ----------
let W = null;  // the current world

function newPlate(W, id, omega) {
  W.plates[id] = { alive: true, w: omega, M: I3(), area: 0, cont: 0 };
}
function freeSlot(W) { for (let k = 0; k < MAXP; k++) if (!W.plates[k] || !W.plates[k].alive) return k; return -1; }

// Multi-source noisy Dijkstra growth: Eden-like ragged fronts. label[] receives seed labels.
function grow(M, seeds, rates, allowed, label, rng, limit, noise = 1) {
  const N = M.N, dist = new Float64Array(N).fill(Infinity), tent = new Int32Array(N).fill(-1), done = new Uint8Array(N);
  const heap = new Heap(4 * N + 16);
  seeds.forEach((v, s) => { dist[v] = 0; tent[v] = s; heap.push(0, v); });
  let count = 0;
  while (heap.n > 0 && count < limit) {
    const v = heap.pop(); if (done[v] || heap.lastKey > dist[v]) continue;
    done[v] = 1; label[v] = tent[v]; count++;
    const s = tent[v];
    for (let e = M.off[v]; e < M.off[v + 1]; e++) {
      const u = M.nbr[e]; if (done[u] || (allowed && !allowed(u))) continue;
      const r = rng() * rng(), c = dist[v] + (1 + noise * (1.5 * r - 0.75)) / rates[s]; // skewed noise: occasional fast fingers
      if (c < dist[u]) { dist[u] = c; tent[u] = s; heap.push(c, u); }
    }
  }
  return count;
}

function makeWorld(params) {
  const rng = mulberry32(params.seed);
  const M = buildMesh(params.N, rng), N = M.N;
  const w = {
    M, N, params, rng, t: 0, events: [],
    plate: new Int16Array(N), cont: new Uint8Array(N), age: new Float32Array(N), upl: new Float32Array(N),
    b: { plate: new Int16Array(N), cont: new Uint8Array(N), age: new Float32Array(N), upl: new Float32Array(N) },
    plates: new Array(MAXP).fill(null), suture: new Float32Array(MAXP * MAXP),
    resamples: 0
  };
  // Plates: random seeds with log-normal growth rates give a spread of sizes.
  const K = Math.min(params.plates, MAXP), seeds = [], rates = [];
  for (let k = 0; k < K; k++) { seeds.push(Math.floor(rng() * N)); rates.push(Math.exp(0.55 * gauss(rng))); }
  const lab = new Int32Array(N).fill(-1);
  grow(M, seeds, rates, null, lab, rng, Infinity);
  for (let i = 0; i < N; i++) w.plate[i] = lab[i];
  for (let k = 0; k < K; k++) {
    const ax = randUnit(rng), v = (1.5 + 6 * rng()) * 10 / R_KM; // 1.5–7.5 cm/yr at the plate's equator, in rad/Myr
    newPlate(w, k, [ax[0] * v, ax[1] * v, ax[2] * v]);
  }
  // Continents: a few cratons grown until the requested area fraction.
  const nc = 2 + Math.floor(rng() * 5), cs = [], cr = [];
  for (let k = 0; k < nc; k++) { cs.push(Math.floor(rng() * N)); cr.push(Math.exp(0.6 * gauss(rng))); }
  const clab = new Int32Array(N).fill(-1);
  grow(M, cs, cr, null, clab, rng, Math.round(params.contFrac * N));
  for (let i = 0; i < N; i++) w.cont[i] = clab[i] >= 0 ? 1 : 0;
  // Seafloor age: hop distance from plate boundaries / a nominal half-spreading rate.
  const hop = new Int32Array(N).fill(-1), q = [];
  for (let i = 0; i < N; i++) for (let e = M.off[i]; e < M.off[i + 1]; e++) if (w.plate[M.nbr[e]] !== w.plate[i]) { hop[i] = 0; q.push(i); break; }
  for (let qi = 0; qi < q.length; qi++) { const v = q[qi]; for (let e = M.off[v]; e < M.off[v + 1]; e++) { const u = M.nbr[e]; if (hop[u] < 0) { hop[u] = hop[v] + 1; q.push(u); } } }
  const hkm = M.h * R_KM;
  for (let i = 0; i < N; i++) w.age[i] = Math.min(180, Math.max(0, hop[i]) * hkm / 25 * (0.7 + 0.6 * rng()));
  tallyPlates(w);
  return w;
}

function tallyPlates(w) {
  for (const p of w.plates) if (p) { p.area = 0; p.cont = 0; }
  for (let i = 0; i < w.N; i++) { const p = w.plates[w.plate[i]]; p.area++; p.cont += w.cont[i]; }
  for (let k = 0; k < MAXP; k++) { const p = w.plates[k]; if (p && p.alive && p.area === 0) { p.alive = false; logEvent(w, `Plate ${k} fully consumed`); } }
}

function logEvent(w, text) { w.events.unshift({ t: w.t, text }); if (w.events.length > 6) w.events.length = 6; logDirty = true; }

// ---------- placeholder rules (to be replaced by the document's algorithm) ----------
const RULE = {
  contBase: 0.4,                         // km, continental freeboard
  oceanDepth: a => Math.max(-6.4, -2.6 - 0.33 * Math.sqrt(a)), // km, half-space-cooling-like subsidence
  arcU: 0.5, arcMax: 5.0,               // km per subduction event, saturating
  colU: 1.3, colMax: 8.5,               // km per collision event, saturating
  erosionTau: 200,                      // Myr, uplift decay
  kappa: 900,                           // km^2/Myr, uplift diffusion
  arcToCont: -2.0, arcMinU: 1.5,        // km: oceanic crust with this much arc uplift, built up above this depth, becomes continental
  sutureLen: 1000, sutureDepth: 250,    // km: contact length x convergence before two plates weld
  sutureTau: 25,                        // Myr memory of contact
  riftTau: 2,                           // Myr; plate k rifts at rate (A_k/A)^2 (0.5 + continental share of k) / riftTau
  riftSpeed: [2, 5]                     // cm/yr relative opening rate
};
const elevOf = (w, i) => w.cont[i] ? RULE.contBase + w.upl[i] : RULE.oceanDepth(w.age[i]) + w.upl[i];

// Greedy walk on the Delaunay graph to the vertex nearest (tx,ty,tz).
function walk(M, start, tx, ty, tz) {
  const P = M.P, off = M.off, nbr = M.nbr;
  let v = start, best = P[3*v]*tx + P[3*v + 1]*ty + P[3*v + 2]*tz;
  for (;;) {
    let nb = -1;
    for (let e = off[v]; e < off[v + 1]; e++) { const j = nbr[e], d = P[3*j]*tx + P[3*j + 1]*ty + P[3*j + 2]*tz; if (d > best) { best = d; nb = j; } }
    if (nb < 0) return v; v = nb;
  }
}

// Re-sample every plate whose pending rotation exceeds `thr` radians onto the fixed mesh.
// Plates below threshold keep accumulating, so sub-cell motion is never rounded away; they are
// drawn at their pending position in the meantime. APPLY must exceed ~1 cell or nearest-vertex
// lookups return the vertex itself and plates stall.
const APPLY = 1.5; // in cell spacings

function resample(w, thr) {

  W = makeWorld({ seed, N: ui.N(), contFrac: ui.cf(), plates: ui.np() });
  uploadMesh(W); logDirty = true;
  $('sMesh').textContent = `${fmtN(W.N)} v · ${fmtN(W.M.T.length / 3)} tri`;
}
function setRunning(r) { running = r; $('run').textContent = r ? 'Pause' : 'Run'; }
$('run').onclick = () => setRunning(!running);
$('reset').onclick = () => regenerate();
$('reseed').onclick = () => { seed = (Math.random() * 2 ** 31) | 0; regenerate(); };
for (const id of ['dt', 'nv', 'cf', 'np']) $(id).addEventListener('input', refreshLabels);
for (const id of ['nv', 'cf', 'np']) $(id).addEventListener('change', regenerate);
$('ex').addEventListener('input', () => { view.exaggeration = +$('ex').value; refreshLabels(); });
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  view.mode = b.dataset.mode;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  drawLegend();
});
$('toggle').onclick = () => { const c = $('panel').classList.toggle('collapsed'); $('toggle').textContent = c ? 'Controls' : 'Hide'; $('toggle').setAttribute('aria-expanded', String(!c)); };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); setRunning(!running); }
  else if (e.key === 'r' || e.key === 'R') regenerate();
  else if (e.key === 'n' || e.key === 'N') $('reseed').click();
});

function drawLegend() {
  const L = $('legend');
  const bar = (fn, lo, hi, ticks, title) => {
    L.innerHTML = `<span>${title}</span><canvas width="200" height="10"></canvas><div class="ticks">${ticks.map(t => `<span>${t}</span>`).join('')}</div>`;
    const cx = L.querySelector('canvas').getContext('2d');
    for (let x = 0; x < 200; x++) { const c = fn(lo + (hi - lo) * x / 199); cx.fillStyle = `rgb(${c.map(Math.round)})`; cx.fillRect(x, 0, 1, 10); }
  };
  const sw = c => `<span class="sw" style="background:rgb(${c.join(',')})"></span>`;
  if (view.mode === 'terrain') bar(terrainRamp, -6.5, 7.5, ['−6', '0', '+7 km'], 'Elevation relative to sea level');
  else if (view.mode === 'age') { bar(ageRamp, 0, 200, ['0', '100', '200 Myr'], 'Oceanic crust age'); L.insertAdjacentHTML('beforeend', `<div class="keys"><span>${sw([118, 114, 106])}continental</span></div>`); }
  else if (view.mode === 'crust') L.innerHTML = `<span>Crust type</span><div class="keys"><span>${sw([198, 162, 110])}continental</span><span>${sw([52, 82, 122])}oceanic</span></div>`;
  else L.innerHTML = `<span>Plate boundaries</span><div class="keys"><span>${sw(BOUND.conv)}convergent</span><span>${sw(BOUND.div)}divergent</span><span>${sw(BOUND.trans)}transform</span></div><span class="helptext">Plate fill is lighter where it carries continent.</span>`;
}

function refreshStats(land) {
  $('clock').innerHTML = `${fmtN(Math.round(W.t))} <small>Myr</small>`;
  let n = 0, c = 0; for (const p of W.plates) if (p && p.alive) { n++; c += p.cont; }
  $('sPlates').textContent = n;
  $('sCont').textContent = `${(100 * c / W.N).toFixed(1)} %`;
  $('sLand').textContent = `${(100 * land).toFixed(1)} %`;
  $('sCost').textContent = `${costMs.toFixed(1)} ms / frame`;
  if (logDirty) {
    logDirty = false;
    $('log').innerHTML = W.events.length ? W.events.map(e => `<li><span class="t">${fmtN(Math.round(e.t))}</span><span>${e.text}</span></li>`).join('') : '<li class="empty">Rifts, sutures and consumed plates appear here.</li>';
  }
}

// ---------- main loop ----------
let last = performance.now(), statTick = 0;
function frame(now) {
  const el = now - last; last = now; if (el > 0 && el < 500) fps = 0.95 * fps + 0.05 * (1000 / el);
  resize();
  if (running) { const t0 = performance.now(); stepWorld(W, ui.dt()); costMs = 0.9 * costMs + 0.1 * (performance.now() - t0); }
  const land = updateBuffers(W);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.useProgram(prog);
  const { R, Pm } = mats();
  gl.uniformMatrix4fv(loc.proj, false, Pm); gl.uniformMatrix4fv(loc.mv, false, R);
  const lx = -0.45, ly = 0.55, lz = 0.70, ll = Math.hypot(lx, ly, lz); gl.uniform3f(loc.light, lx / ll, ly / ll, lz / ll);
  gl.bindVertexArray(vao); gl.drawElements(gl.TRIANGLES, gpu.count, gl.UNSIGNED_INT, 0);
  if (++statTick % 6 === 0) { refreshStats(land); refreshLabels(); }
  requestAnimationFrame(frame);
}

if (!gl || typeof Delaunator === 'undefined') {
  document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;inset:auto 16px 50% 16px;text-align:center">This page needs WebGL2 and the Delaunator script from cdn.jsdelivr.net. One of them did not load.</p>');
} else {
  if (window.matchMedia('(max-width: 640px)').matches) $('toggle').click(); // phones start with the globe unobstructed
  refreshLabels(); regenerate(); drawLegend(); requestAnimationFrame(frame);
}
</script>
